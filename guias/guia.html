<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Perfil de guia | Bento Pantanal</title>
</head>
<body>
  <p>Abrindo perfil...</p>
  <script>
    const slug = new URLSearchParams(location.search).get("slug");
    location.replace(slug ? `/guias/perfil/?slug=${encodeURIComponent(slug)}` : "/guias/");
  </script>
</body>
</html>
