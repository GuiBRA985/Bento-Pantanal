<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173a2b">
  <meta name="robots" content="noindex">
  <title>Área do guia | Bento Pantanal</title>
  <link rel="stylesheet" href="/css/guides.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js" defer></script>
  <script src="/js/supabase-client.js" defer></script>
  <script src="/js/guide-auth.js" defer></script>
</head>
<body>
  <header class="account-header">
    <nav class="site-nav" aria-label="Navegação principal">
      <a class="brand" href="/">BENTO PANTANAL</a>
      <a class="nav-link" href="/guias/">Ver guias</a>
    </nav>
    <div class="account-intro">
      <span class="eyebrow">Rede de Guias</span>
      <h1>Sua presença profissional no Pantanal.</h1>
      <p>Entre para editar seu perfil ou crie gratuitamente sua conta.</p>
    </div>
  </header>

  <main class="account-shell">
    <div class="surface">
      <div class="notice notice-success hidden" id="active-session"></div>
      <div class="tabs" role="tablist" aria-label="Acesso">
        <button class="button tab-button" type="button" data-auth-tab="login" aria-selected="true">Entrar</button>
        <button class="button tab-button" type="button" data-auth-tab="signup" aria-selected="false">Criar conta</button>
        <button class="button tab-button" type="button" data-auth-tab="recovery" aria-selected="false">Recuperar</button>
      </div>

      <div class="notice hidden" id="auth-notice" role="status"></div>

      <section data-auth-panel="login">
        <form class="form-grid" id="login-form">
          <div class="field"><label for="login-email">E-mail</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="login-password">Senha</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
          <button class="button" type="submit" data-label="Entrar">Entrar</button>
          <button class="button button-outline" id="google-login" type="button">Continuar com Google</button>
        </form>
      </section>

      <section class="hidden" data-auth-panel="signup">
        <form class="form-grid" id="signup-form">
          <div class="field"><label for="signup-email">E-mail</label><input id="signup-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="signup-password">Senha</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="field-help">Mínimo de 8 caracteres.</p></div>
          <button class="button button-gold" type="submit" data-label="Criar conta gratuita">Criar conta gratuita</button>
        </form>
      </section>

      <section class="hidden" data-auth-panel="recovery">
        <form class="form-grid" id="recovery-form">
          <div class="field"><label for="recovery-email">E-mail cadastrado</label><input id="recovery-email" name="email" type="email" autocomplete="email" required></div>
          <button class="button" type="submit" data-label="Enviar link de recuperação">Enviar link de recuperação</button>
        </form>
      </section>

      <section class="hidden" data-auth-panel="new-password">
        <form class="form-grid" id="new-password-form">
          <h2>Defina sua nova senha</h2>
          <div class="field"><label for="new-password">Nova senha</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
          <button class="button" type="submit" data-label="Atualizar senha">Atualizar senha</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
